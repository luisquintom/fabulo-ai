services:
  # 1. Base de Datos
  db:
    image: postgres:15-alpine
    container_name: fabulo_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend (Django)
  backend:
    build: ./backend
    container_name: fabulo_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env

  # 3. Frontend (Angular)
  frontend:
    build: ./frontend
    container_name: fabulo_frontend
    volumes:
      # Sincroniza tu carpeta local con el contenedor para ver cambios en vivo
      - ./frontend:/app
    ports:
      - "4200:4200"
    depends_on:
      - backend

volumes:
  postgres_data: